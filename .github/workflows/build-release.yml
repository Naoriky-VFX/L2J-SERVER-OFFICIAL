name: compilar e lançar release

# Compila o L2J (game, login, datapack) e publica release com os .zip.
# Só cria release quando o Bitbucket publica uma VERSÃO NOVA (tag nova).
# Também roda no botão "Run workflow" (com opção de forçar).

on:
  schedule:
    - cron: "0 3 * * *"   # 00:00 de Brasília, depois do sync
  workflow_dispatch:
    inputs:
      forcar:
        description: "Criar release mesmo que a versão já exista"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      novo: ${{ steps.existe.outputs.novo }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ver qual é a última versão oficial (tags do Bitbucket)
        id: versao
        run: |
          set -e
          ultima() {
            git ls-remote --tags "https://bitbucket.org/l2jserver/$1.git" 'refs/tags/2.*' \
              | awk -F/ '{print $3}' | grep -v '\^{}' | sort -V | tail -1
          }
          G=$(ultima l2j-server-game)
          L=$(ultima l2j-server-login)
          D=$(ultima l2j-server-datapack)
          VER="${G:-0.0.0}"
          echo "versao=$VER" >> "$GITHUB_OUTPUT"
          echo "login=$L" >> "$GITHUB_OUTPUT"
          echo "datapack=$D" >> "$GITHUB_OUTPUT"
          echo "Última versão oficial: game=$G login=$L datapack=$D"

      - name: Já existe release dessa versão?
        id: existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.versao.outputs.versao }}" >/dev/null 2>&1; then
            echo "novo=false" >> "$GITHUB_OUTPUT"
            echo "Essa versão já foi lançada. Nada a fazer."
          else
            echo "novo=true" >> "$GITHUB_OUTPUT"
            echo "Versão nova: ${{ steps.versao.outputs.versao }}"
          fi

      - name: Instalar Java 25
        if: steps.existe.outputs.novo == 'true' || inputs.forcar
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Dar permissão nos scripts do Maven
        if: steps.existe.outputs.novo == 'true' || inputs.forcar
        run: |
          for pasta in commons game login datapack; do
            [ -f "$pasta/mvnw" ] && chmod +x "$pasta/mvnw"
          done

      - name: Compilar commons
        if: steps.existe.outputs.novo == 'true' || inputs.forcar
        run: |
          if [ -f commons/pom.xml ]; then
            cd commons && ./mvnw -B -q -DskipTests -Ddependency-check.skip=true install
          fi

      - name: Compilar game
        if: steps.existe.outputs.novo == 'true' || inputs.forcar
        run: cd game && ./mvnw -B -q -DskipTests -Ddependency-check.skip=true install

      - name: Compilar login
        if: steps.existe.outputs.novo == 'true' || inputs.forcar
        run: cd login && ./mvnw -B -q -DskipTests -Ddependency-check.skip=true install

      - name: Compilar datapack
        if: steps.existe.outputs.novo == 'true' || inputs.forcar
        run: cd datapack && ./mvnw -B -q -DskipTests -Ddependency-check.skip=true install

      - name: Juntar os pacotes
        if: steps.existe.outputs.novo == 'true' || inputs.forcar
        run: |
          set -e
          mkdir -p /tmp/pacotes
          cp game/target/*.zip /tmp/pacotes/ 2>/dev/null || true
          cp login/target/*.zip /tmp/pacotes/ 2>/dev/null || true
          cp datapack/target/*.zip /tmp/pacotes/ 2>/dev/null || true
          ls -lh /tmp/pacotes
          if [ -z "$(ls -A /tmp/pacotes)" ]; then
            echo "::error::Nenhum .zip foi gerado"
            exit 1
          fi

      - name: Publicar release
        if: steps.existe.outputs.novo == 'true' || inputs.forcar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.versao }}
          name: L2J ${{ steps.versao.outputs.versao }}
          body: |
            Compilado automaticamente do espelho do L2J oficial (Bitbucket).

            **Versão:** `${{ steps.versao.outputs.versao }}`
            - Login server: `${{ steps.versao.outputs.login }}`
            - Datapack: `${{ steps.versao.outputs.datapack }}`
            - Commit do espelho: `${{ github.sha }}`
            - Java: 25 (Temurin)
          files: /tmp/pacotes/*.zip
          make_latest: true
