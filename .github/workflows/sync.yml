name: sync L2J oficial

# Busca as atualizações no Bitbucket (l2jserver) e comita aqui.
on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC = 02:15 no horário de Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: sync-l2j
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar este repositório
        uses: actions/checkout@v4

      - name: Buscar os 4 repositórios oficiais
        run: |
          set -e
          rm -rf /tmp/l2j
          mkdir -p /tmp/l2j
          git clone --depth 1 https://bitbucket.org/l2jserver/l2j-server-game.git     /tmp/l2j/game
          git clone --depth 1 https://bitbucket.org/l2jserver/l2j-server-datapack.git /tmp/l2j/datapack
          git clone --depth 1 https://bitbucket.org/l2jserver/l2j-server-login.git    /tmp/l2j/login
          git clone --depth 1 https://bitbucket.org/l2jserver/l2j-server-commons.git  /tmp/l2j/commons

      - name: Espelhar (sem a pasta .git de cada um)
        run: |
          set -e
          for pasta in game datapack login commons; do
            rm -rf "$pasta"
            mkdir -p "$pasta"
            rsync -a --exclude='.git' "/tmp/l2j/$pasta/" "$pasta/"
          done

      - name: Comitar se mudou algo
        run: |
          git config user.name "l2j-sync"
          git config user.email "sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou no Bitbucket hoje."
          else
            git commit -m "sync: L2J oficial $(date -u +%Y-%m-%d)"
            git push
          fi
