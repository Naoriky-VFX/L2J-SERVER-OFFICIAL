# ---------------------------------------------------------------------------
# Discord Bot
# https://discord.com/developers/applications/
# Use the link above to create your discord bot and there you will find the info needed for (DiscordBotToken =)
# Create a discord server and activate Developer mode. (User Settings->Appearance->Developer Mode.)
# Developer Mode exposes context menu items helpful for people writing bot using Discord API.
# ---------------------------------------------------------------------------
# Use the prefix for your Discord Bot to listen to commands. (Required)
# Example is //admin, that means if you don't type "//" you can't execute the admin command.
# Default: //
BotPrefix = //

# Use the token from your Discord Application that you created! (Required)
# https://discord.com/developers/applications/
# A Discord Bot Token is a short phrase (represented as a jumble of letters and numbers) that acts as a key to control a Discord Bot.
# Tokens are used inside bot code to send commands back and forth to the API, which in turn controls bot actions.
# WARNING Never share your Discord Bot Token with anyone. WARNING.
BotToken =

# Use the Server ID from your Discord Server/Guild. (Required)
# Developer Mode must be ON. Right click the Discord Server/Guild to get the id. (Copy ID)
ServerId =

# Use the Role ID from your Discord Server/Guild that you have for your Moderators. (Optional)
# Developer Mode must be ON. Right click the role to get the id. (Copy ID)
ModeratorRoleId =

# Use the Channel ID from your Discord Server/Guild that you have your announcements posted. (Optional)
# Developer Mode must be ON. Right click the channel to get the id. (Copy ID)
AnnouncementsChannelId =

# Use the Bot to send a welcome message to all new members that join your Discord Server/Guild. (Optional)
# Default = False
WelcomeMessageEnable = False

# Use the Channel ID from your Discord Server/Guild that you want the welcome message to be posted. (Optional)
# This will only work if the above option (WelcomeMessageEnable = True) is enabled.
# Developer Mode must be ON. Right click the channel to get the id. (Copy ID)
WelcomeChannelId =

# After how long the bot will delete the welcome message from the channel mentioned above. (Required)
# Time in minutes.
WelcomeMessageDeleteDelay =

# Use the Channel ID from your Discord Server/Guild that you have your rules posted. (Optional)
# Developer Mode must be ON. Right click the channel to get the id. (Copy ID)
RulesChannelId =

# Use the Channel ID from your Discord Server/Guild that you want to use. (Optional)
# Developer Mode must be ON. Right click the channel to get the id. (Copy ID)
OptionalChannelOneId =

# Use the Channel ID from your Discord Server/Guild that you want to use. (Optional)
# Developer Mode must be ON. Right click the channel to get the id. (Copy ID)
OptionalChannelTwoId =

# Use the Channel ID from your Discord Server/Guild that you want to use. (Optional)
# Developer Mode must be ON. Right click the channel to get the id. (Copy ID)
OptionalChannelThreeId =

# Use the Bot to give a specific role to all new members that join your Discord Server/Guild. (Optional)
# Default = False
AutoRoleEnable = False

# Use the Bot to give a role to all new members that join your Discord Server/Guild. (Optional)
# This will only work if the above option (AutoRoleEnable = True) is enabled.
# Developer Mode must be ON. Right click the Role name to get the id. (Copy ID)
AutoRoleId =

# Use the Channel ID from your Discord Server/Guild that you want the auto support to be posted. (Optional)
# Developer Mode must be ON. Right click the channel to get the id. (Copy ID)
AutoSupportChannelId =

# Use the Channel ID from your Discord Server/Guild that you want the logs to be posted. (Optional)
# Developer Mode must be ON. Right click the channel to get the id. (Copy ID)
LogsChannelId =

# After how long is the bot going to delete its own messages from auto support channel. (Required)
# Time in seconds.
BotDeleteDelay =

# After how long is the bot going to delete a message send by the user in auto support channel. (Required)
# Time in seconds.
UserDeleteDelay =

# Use the bot to delete messages or words or links ;) that a member sends. (Optional)
# Example: stupid, crazy, www.paypal.com, account, bank, paypal (this words are used as example dont use them live)
### WARNING Use this properties wisely (You might delete good messages from user). WARNING ####
ForbiddenWords = https://discord.com/invite/,https://discord.gg/